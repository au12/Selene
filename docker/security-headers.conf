# Included by every location: nginx drops server-level add_header lines in any location that sets its own.
# HSTS belongs on the HTTPS reverse proxy in front of this container, not here.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
add_header Permissions-Policy "geolocation=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self), camera=(), microphone=(), payment=(), usb=()" always;
# Content-Security-Policy, generated at build time with hashes of the page's inline scripts
include /etc/nginx/csp.conf;
