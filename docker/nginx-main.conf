# Main nginx config for the Selene image. nginx runs as the unprivileged `nginx` user (uid 101), so it can run with a
# read-only root filesystem and no capabilities: the pid file and all temp paths live in /tmp (a tmpfs in the Unraid
# template). Listening on port 80 without root relies on Docker's default for bridge networking (20.10+), which lets
# any user bind low ports inside the container's own network namespace.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;                # no nginx version in headers or error pages
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  client_max_body_size 1k;          # nothing is ever uploaded
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 10s;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  access_log /dev/stdout;
  include /etc/nginx/conf.d/*.conf;
}
