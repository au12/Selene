# Selene: one static page, served read-only. Nothing is stored server-side.

# Behind a reverse proxy, trust X-Forwarded-For only from private addresses, so the log and the rate limit see the
# real visitor rather than the proxy.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
set_real_ip_from fc00::/7;
set_real_ip_from ::1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# A page load is about five requests; this only bites on something hammering the server.
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
limit_req_status 429;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  gzip on;
  gzip_types text/css application/javascript application/manifest+json image/svg+xml;
  gzip_min_length 1024;

  limit_req zone=perip burst=40 nodelay;
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }

  include /etc/nginx/security-headers.conf;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location = /index.html { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache" always; }
  location = /sw.js { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache" always; }
  location ~* \.(png|webmanifest)$ { include /etc/nginx/security-headers.conf; add_header Cache-Control "public, max-age=604800" always; }
  location ~ /\. { return 404; }
  location / { try_files $uri $uri/ /index.html; }
}
