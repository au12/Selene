<text x="40" y="600" fill="#8b98ad" font-size="12.5">Rear buttons: 12 mm panel-mount momentary (SET · MODE · REV · FWD) · top: 16 mm momentary (LIGHT/SNOOZE) · 12/24: 6×6 mm tactile behind the pin hole.</text>
<text x="40" y="620" fill="#8b98ad" font-size="12.5">Speaker → “SPK” PH2.0 header (kit speaker or any 8 Ω 1–2 W) · Power → USB-C, 5 V 2 A. Touch: tap = light/snooze, swipe = change face.</text>
