# ─────────────────────────────────────────────────────────────────────────────
#  Selene lunar alarm clock — ESPHome firmware
#  Board: Waveshare ESP32-P4-WIFI6-Touch-LCD-4C (4" round IPS 720x720, GT9271 touch,
#         ES8311 codec + NS4150B amp, ESP32-C6 Wi-Fi 6 co-processor over SDIO)
#  Faces: Arc (watch style) · Desk (alarm clock) · Noir (night) — swipe to change
# ─────────────────────────────────────────────────────────────────────────────
substitutions:
  name: selene-clock
  friendly_name: Selene Clock
  timezone: America/New_York
  latitude: "34.85"      # used until changed on the clock (SET → LO/LA) or from Home Assistant
  longitude: "-82.39"
  default_face: arc      # arc | desk | noir
  rotation: "0"          # 0/90/180/270 if your mounting puts the panel's top elsewhere

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.11.0
  project:
    name: au12.selene-clock
    version: "1.0.0"
  on_boot:
    priority: 600
    then:
      - light.turn_on:
          id: backlight
          brightness: 100%

esp32:
  variant: esp32p4
  flash_size: 16MB           # board has 32MB; 16MB avoids experimental IDF features for OTA and leaves ~8MB per app slot
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
  # Pre-production ESP32-P4 silicon (boot log shows "chip revision: v1.x")? uncomment:
  # engineering_sample: true

psram:

esp_ldo:
  - channel: 3          # MIPI-DSI PHY supply
    voltage: 2.5V

esp32_hosted:           # Wi-Fi 6 via the on-board ESP32-C6 (SDIO)
  variant: esp32c6
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  reset_pin: GPIO54

logger:
  level: INFO

api:
  encryption:
    key: !secret selene_api_key

ota:
  - platform: esphome
    password: !secret selene_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Selene-Clock-Setup

captive_portal:

external_components:
  - source:
      type: local
      path: components
    # or straight from GitHub:
    # source: github://au12/selene/firmware/components@main
    components: [selene]

# ── time ─────────────────────────────────────────────────────────────────────
time:
  - platform: homeassistant
    id: ha_time
    timezone: ${timezone}
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}

# ── display, backlight, touch ────────────────────────────────────────────────
i2c:
  - id: bus_a
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz

display:
  - platform: mipi_dsi
    id: lcd
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-4C
    reset_pin: GPIO27
    update_interval: never      # Selene pushes only the pixels that change
    auto_clear_enabled: false

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO26
    frequency: 20kHz

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 600ms
    gamma_correct: 2.2

touchscreen:
  - platform: gt911            # GT9271 (GT911-compatible); INT is not routed on this board → polled
    id: touch
    i2c_id: bus_a
    display: lcd
    update_interval: 30ms
    on_touch:
      - lambda: 'id(selene_clock).touch(true, touch.x, touch.y);'
    on_update:
      - lambda: |-
          for (auto &t : touches) id(selene_clock).touch(true, t.x, t.y);
    on_release:
      - lambda: 'id(selene_clock).touch(false, 0, 0);'

# ── audio: ES8311 codec → NS4150B amp → 8Ω speaker (PH2.0 "SPK" header) ─────
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12
    i2s_mclk_pin: GPIO13

audio_dac:
  - platform: es8311
    id: codec
    i2c_id: bus_a
    use_mclk: true

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO9
    dac_type: external
    audio_dac: codec
    sample_rate: 16000
    channel: mono

switch:
  - platform: gpio
    id: amp
    pin: GPIO53                 # NS4150B power-amplifier enable
    restore_mode: ALWAYS_OFF
  - platform: template
    name: Alarm
    icon: mdi:alarm
    lambda: 'return id(selene_clock).alarm_enabled();'
    turn_on_action: [lambda: 'id(selene_clock).set_alarm_enabled(true);']
    turn_off_action: [lambda: 'id(selene_clock).set_alarm_enabled(false);']
  - platform: template
    name: Hourly chime
    icon: mdi:bell-ring-outline
    lambda: 'return id(selene_clock).chime_enabled();'
    turn_on_action: [lambda: 'id(selene_clock).set_chime_enabled(true);']
    turn_off_action: [lambda: 'id(selene_clock).set_chime_enabled(false);']
  - platform: template
    name: 24-hour time
    icon: mdi:hours-24
    lambda: 'return id(selene_clock).is_24h();'
    turn_on_action: [lambda: 'id(selene_clock).set_24h(true);']
    turn_off_action: [lambda: 'id(selene_clock).set_24h(false);']
  - platform: template
    name: Auto dim at night
    id: auto_dim
    icon: mdi:weather-night
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

rtttl:
  id: buzzer
  speaker: spk
  gain: 70%
  on_finished_playback:
    - delay: 150ms
    - switch.turn_off: amp

# ── the clock ────────────────────────────────────────────────────────────────
selene:
  id: selene_clock
  display_id: lcd
  time_id: ha_time
  latitude: ${latitude}
  longitude: ${longitude}
  rotation: ${rotation}
  default_face: ${default_face}
  on_sound:
    - if:
        condition:
          lambda: 'return sound == "stop";'
        then:
          - rtttl.stop: {id: buzzer}
        else:
          - switch.turn_on: amp
          - rtttl.play:
              id: buzzer
              rtttl: !lambda 'return esphome::selene::SeleneClock::rtttl_for(sound);'
  on_light:
    - script.execute: light_boost
  on_face_change:                 # keep Home Assistant in sync when the face is swiped on the clock
    - component.update: face_select

script:
  - id: light_boost             # LIGHT/SNOOZE or a tap on the glass: full brightness for 4 s
    mode: restart
    then:
      - light.turn_on: {id: backlight, brightness: 100%, transition_length: 120ms}
      - delay: 4s
      - script.execute: apply_brightness
  - id: apply_brightness
    then:
      - light.turn_on:
          id: backlight
          brightness: !lambda |-
            const bool night = id(auto_dim).state && id(selene_clock).is_dark();
            return (night ? id(night_brightness).state : id(day_brightness).state) / 100.0f;

interval:
  - interval: 60s
    then:
      - if:
          condition:
            not:
              script.is_running: light_boost
          then:
            - script.execute: apply_brightness

# ── physical buttons (40-pin header, each button to GND) ─────────────────────
#   rear row (left→right, viewed from behind): SET · MODE · REV · FWD ; top: LIGHT/SNOOZE ; pin hole: 12/24
binary_sensor:
  - platform: gpio
    id: btn_set
    pin: {number: GPIO20, mode: {input: true, pullup: true}, inverted: true}
    filters: [{delayed_on: 15ms}, {delayed_off: 15ms}]
    on_press: [lambda: "id(selene_clock).press('B');"]
    on_release: [lambda: "id(selene_clock).release('B');"]
  - platform: gpio
    id: btn_mode
    pin: {number: GPIO21, mode: {input: true, pullup: true}, inverted: true}
    filters: [{delayed_on: 15ms}, {delayed_off: 15ms}]
    on_press: [lambda: "id(selene_clock).press('C');"]
    on_release: [lambda: "id(selene_clock).release('C');"]
  - platform: gpio
    id: btn_rev
    pin: {number: GPIO22, mode: {input: true, pullup: true}, inverted: true}
    filters: [{delayed_on: 15ms}, {delayed_off: 15ms}]
    on_press: [lambda: "id(selene_clock).press('D');"]
    on_release: [lambda: "id(selene_clock).release('D');"]
  - platform: gpio
    id: btn_fwd
    pin: {number: GPIO28, mode: {input: true, pullup: true}, inverted: true}
    filters: [{delayed_on: 15ms}, {delayed_off: 15ms}]
    on_press: [lambda: "id(selene_clock).press('A');"]
    on_release: [lambda: "id(selene_clock).release('A');"]
  - platform: gpio
    id: btn_light
    pin: {number: GPIO29, mode: {input: true, pullup: true}, inverted: true}
    filters: [{delayed_on: 15ms}, {delayed_off: 15ms}]
    on_press: [lambda: "id(selene_clock).press('L');"]
    on_release: [lambda: "id(selene_clock).release('L');"]
  - platform: gpio
    id: btn_1224                # recessed 12/24 pin switch
    pin: {number: GPIO30, mode: {input: true, pullup: true}, inverted: true}
    filters: [{delayed_on: 30ms}]
    on_press: [lambda: "id(selene_clock).set_24h(!id(selene_clock).is_24h());"]
  - platform: template
    name: Alarm ringing
    icon: mdi:alarm-light
    lambda: 'return id(selene_clock).ringing();'

# ── Home Assistant controls & data ───────────────────────────────────────────
select:
  - platform: template
    id: face_select
    name: Face
    icon: mdi:watch-variant
    options: [Arc, Desk, Noir]
    lambda: 'return id(selene_clock).face_name();'
    set_action:
      - lambda: 'id(selene_clock).set_face_by_name(x);'

number:
  - platform: template
    name: Alarm hour
    icon: mdi:alarm
    min_value: 0
    max_value: 23
    step: 1
    mode: box
    lambda: 'return id(selene_clock).alarm_hour();'
    set_action: [lambda: 'id(selene_clock).set_alarm_hour((int) x);']
  - platform: template
    name: Alarm minute
    icon: mdi:alarm
    min_value: 0
    max_value: 59
    step: 1
    mode: box
    lambda: 'return id(selene_clock).alarm_minute();'
    set_action: [lambda: 'id(selene_clock).set_alarm_minute((int) x);']
  - platform: template
    name: Latitude
    icon: mdi:latitude
    min_value: -65
    max_value: 65
    step: 0.01
    mode: box
    unit_of_measurement: "°"
    lambda: 'return id(selene_clock).latitude();'
    set_action: [lambda: 'id(selene_clock).set_latitude(x);']
  - platform: template
    name: Longitude
    icon: mdi:longitude
    min_value: -180
    max_value: 180
    step: 0.01
    mode: box
    unit_of_measurement: "°"
    lambda: 'return id(selene_clock).longitude();'
    set_action: [lambda: 'id(selene_clock).set_longitude(x);']
  - platform: template
    id: day_brightness
    name: Day brightness
    icon: mdi:brightness-7
    min_value: 5
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 80
    on_value: [script.execute: apply_brightness]
  - platform: template
    id: night_brightness
    name: Night brightness
    icon: mdi:brightness-4
    min_value: 1
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 12
    on_value: [script.execute: apply_brightness]

button:
  - platform: template
    name: Next face
    icon: mdi:swap-horizontal
    on_press: [lambda: 'id(selene_clock).next_face();']
  - platform: template
    name: Demo
    icon: mdi:moon-waning-crescent
    on_press: [lambda: 'id(selene_clock).start_demo();']
  - platform: template
    name: Stop alarm
    icon: mdi:alarm-off
    on_press: [lambda: 'id(selene_clock).stop_alarm();']
  - platform: restart
    name: Restart

sensor:
  - platform: template
    name: Moon age
    icon: mdi:moon-waxing-crescent
    unit_of_measurement: d
    accuracy_decimals: 1
    update_interval: 10min
    lambda: 'return id(selene_clock).moon_age();'
  - platform: template
    name: Moon illumination
    icon: mdi:brightness-3
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 10min
    lambda: 'return id(selene_clock).moon_illumination();'
  - platform: template
    name: Moon elevation
    icon: mdi:angle-acute
    unit_of_measurement: "°"
    accuracy_decimals: 1
    update_interval: 5min
    lambda: 'return id(selene_clock).moon_elevation();'
  - platform: template
    name: Sun elevation
    icon: mdi:weather-sunset
    unit_of_measurement: "°"
    accuracy_decimals: 1
    update_interval: 5min
    lambda: 'return id(selene_clock).sun_elevation();'

text_sensor:
  - platform: template
    name: Moon phase
    icon: mdi:moon-full
    update_interval: 10min
    lambda: 'return id(selene_clock).moon_phase_name();'
  - platform: template
    name: Sunrise today
    icon: mdi:weather-sunset-up
    update_interval: 15min
    lambda: 'return id(selene_clock).event_time("sunrise");'
  - platform: template
    name: Sunset today
    icon: mdi:weather-sunset-down
    update_interval: 15min
    lambda: 'return id(selene_clock).event_time("sunset");'
  - platform: template
    name: Moonrise today
    icon: mdi:arrow-up-bold-circle-outline
    update_interval: 15min
    lambda: 'return id(selene_clock).event_time("moonrise");'
  - platform: template
    name: Moonset today
    icon: mdi:arrow-down-bold-circle-outline
    update_interval: 15min
    lambda: 'return id(selene_clock).event_time("moonset");'
